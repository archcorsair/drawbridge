name: Release

# Live: every pushed v* tag builds and publishes a GitHub release in this
# repo and pushes the cask to archcorsair/homebrew-drawbridge. A prerelease
# tag (vX.Y.Z-rc1) still publishes the GitHub release, but the cask's
# `skip_upload: auto` keeps it out of the tap. The repo has been public, with
# Actions enabled, since 2026-08-02 (v0.0.1).
#
# There is no test job here on purpose — CI is ci.yml's job, and the release
# protocol is that the user runs the full suite (`just test-guest`, `just
# e2e`, `go test ./...`) before tagging. A tag push means "this commit was
# already verified"; this workflow only builds and publishes it.
#
# Secrets it needs:
#   GITHUB_TOKEN         — provided automatically; contents:write below lets
#                          goreleaser create the release in THIS repo.
#   HOMEBREW_TAP_TOKEN   — a fine-grained PAT with contents:write on
#                          archcorsair/homebrew-drawbridge only. GITHUB_TOKEN
#                          cannot write to another repository.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: goreleaser
    # macOS runner: the release builds darwin universal binaries, and
    # `lipo` is macOS-only. The guest binaries are plain Go cross-builds
    # (CGO_ENABLED=0), so they need nothing beyond the toolchain.
    runs-on: macos-latest
    steps:
      # fetch-depth: 0 — goreleaser needs the full history and tags to
      # compute the version and the changelog.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # An exact Go patch, never go-version-file. setup-go reads go.mod's
      # `go 1.25.0` as the exact version 1.25.0, a stdlib with none of its
      # patch releases (audit M28: 35 to 36 reachable govulncheck advisories
      # in the release binaries, the root daemon and root guest agent
      # included). A `toolchain` directive does not help: this setup-go reads
      # only the `go` line. go.mod keeps 1.25.0 as the downstream minimum,
      # which ci.yml's matrix tests on purpose. This pin matches mise.toml
      # and ci.yml's govulncheck job; bump all three together.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: go.sum

      # Hand-written release notes, when the tag has them. goreleaser's
      # `--release-notes FILE` replaces the generated changelog body
      # entirely, so this is opt-in per tag: a tag with no
      # docs/releases/<tag>.md keeps the commit-derived changelog exactly as
      # v0.0.1..v0.1.1 had it. Computed here rather than in the goreleaser
      # config because goreleaser's templating cannot read a file.
      - id: notes
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "args=release --clean --release-notes $f" >> "$GITHUB_OUTPUT"
          else
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to the exact version mise.toml pins, so a snapshot built by
      # `just release-snapshot` and the tagged release built here come out of
      # the same goreleaser. Bump both together.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: '2.17.1'
          args: ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
